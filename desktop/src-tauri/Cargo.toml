[package]
name = "local-character-desktop"
version = "0.3.0"
description = "Local Character Desktop: chat local con modelos GGUF para Windows"
authors = ["Local Character"]
edition = "2021"

[lib]
name = "local_character_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
base64 = "0.22"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
